app-id: org.freedesktop.Sdk.Extension.node26
branch: '26.08'
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-extension: true
separate-locales: false
build-options:
  prefix: /usr/lib/sdk/node26
  prepend-path: /usr/lib/sdk/node26/bin
  prepend-ld-library-path: /usr/lib/sdk/node26/lib
  append-path: /usr/lib/sdk/rust-stable/bin
  strip: true
  # mold
  env:
    - RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    - LDFLAGS: "-fuse-ld=mold"
cleanup:
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/systemtap
modules:
  - name: node
    sources:
      - type: archive
        url: https://nodejs.org/dist/v26.11.0/node-v26.11.0.tar.xz
        sha256: aaad9242704524109e88d48be7bb7b7943486d931e740a352c02e97e107f18c9
        x-checker-data:
          type: json
          url: https://nodejs.org/dist/index.json
          tag-query: >-
            map(select(.version|startswith("v26."))) | sort_by(.date) | last | .version
          version-query: >-
            $tag | sub("^[vV]"; "")
          url-query: >-
            "https://nodejs.org/dist/\($tag)/node-\($tag).tar.xz"
          is-main-source: true
      - type: patch
        path: patches/add_climits_include.patch
    config-opts:
      - --openssl-use-def-ca-store
      - --shared-openssl
      - --shared-zlib
      - --with-intl=system-icu
      - --ninja
      - --v8-enable-temporal-support

  - name: yarn
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/{bin,share}
      - cp -a . ${FLATPAK_DEST}/share/yarn
      - ln -sr ${FLATPAK_DEST}/share/yarn/bin/yarn ${FLATPAK_DEST}/bin/yarn
      - ln -sr ${FLATPAK_DEST}/share/yarn/bin/yarnpkg ${FLATPAK_DEST}/bin/yarnpkg
    sources:
      - type: archive
        url: https://github.com/yarnpkg/yarn/releases/download/v1.22.22/yarn-v1.22.22.tar.gz
        sha256: 88268464199d1611fcf73ce9c0a6c4d44c7d5363682720d8506f6508addf36a0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yarnpkg/yarn/releases/latest
          version-query: >-
            .tag_name | sub("^[vV]"; "")
          url-query: >-
            .assets | map(select(.name|endswith(".tar.gz"))) | first | .browser_download_url

  - name: scripts
    buildsystem: simple
    build-commands:
      - install -Dm755 {enable,install{,-sdk}}.sh -t ${FLATPAK_DEST}/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: script
        dest-filename: install.sh
        commands:
          - install -Dm 755 /usr/lib/sdk/node26/bin/node ${FLATPAK_DEST}/node/bin/node
      - type: script
        dest-filename: install-sdk.sh
        commands:
          - cp -r /usr/lib/sdk/node26 ${FLATPAK_DEST}/node
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/node26/bin
          - export npm_config_nodedir=/usr/lib/sdk/node26
        dest-filename: enable.sh
      - type: file
        path: org.freedesktop.Sdk.Extension.node26.metainfo.xml
